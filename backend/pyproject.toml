[project]
name = "perigee-core"
version = "0.1.0"
description = "Perigee Core — field identity-screening API. Stateless, no ML dependencies."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the framework idiom
    "RUF012", # mutable class attrs; pydantic models handle this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: requires a live PostgreSQL with pgvector (skipped when PERIGEE_TEST_DATABASE_URL is unset)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.pyright]
include = ["app", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
# Resolve dependencies from the local virtualenv. CI creates one at the same
# path so local and CI type-check against an identical environment.
venvPath = "."
venv = ".venv"
